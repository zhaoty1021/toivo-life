[project]
name = "toivo-life"
version = "0.3.1"
description = "Toivo Life · 多业务线 AI 诊断工具 (简历深度诊断 / JD 定制 / 项目梳理...)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "赵天宇" }]

dependencies = [
    "jinja2>=3.1",
    "playwright>=1.40",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "anthropic>=0.34",         # provider "anthropic" 才用到, 装它无害
]

[project.optional-dependencies]
dotenv = ["python-dotenv>=1.0"]

[project.scripts]
toivo = "toivo.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# 只打包 toivo/ 下面, 不打包 archive/ output/ tests/ 等
packages = { find = { include = ["toivo*"] } }
# 业务线的 prompts / templates / product.yaml 也要跟着走
[tool.setuptools.package-data]
toivo = [
    "products/*/product.yaml",
    "products/*/prompts/*.txt",
    "products/*/templates/*.html",
    "products/*/templates/*.css",
]
